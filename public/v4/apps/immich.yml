captainVersion: 4

services:
    $$cap_appname:
        caproverExtra:
            containerHttpPort: 2283
        image: ghcr.io/immich-app/immich-server:$$cap_version
        ports:
            - 2283:2283
        # extends:
        #   file: hwaccel.transcoding.yml
        #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
        environment:
            DB_PASSWORD: $$cap_app_db_pass
            DB_USERNAME: $$cap_app_db_user
            DB_DATABASE_NAME: $$cap_app_db_name
            DB_HOSTNAME: srv-captain--$$cap_appname-db
            REDIS_HOSTNAME: srv-captain--$$cap_appname-redis
            UPLOAD_LOCATION: /data
            IMMICH_MACHINE_LEARNING_URL: http://srv-captain--$$cap_appname-machine-learning:3003
            IMMICH_LOG_LEVEL: log
            DB_SKIP_MIGRATIONS: 'false'
            IMMICH_API_METRICS_PORT: 8081
            IMMICH_MICROSERVICES_METRICS_PORT: 8082
            IMMICH_TELEMETRY_INCLUDE: all
        volumes:
            - $$cap_app_media_root:/data
            - /etc/localtime:/etc/localtime:ro
        depends_on:
            - $$cap_appname-redis
            - $$cap_appname-db
            - $$cap_appname-machine-learning
        serviceUpdateOverride: >
            { "TaskTemplate": { "RestartPolicy": { "Condition": "none", "MaxAttempts": 0 } } }

    $$cap_appname-machine-learning:
        caproverExtra:
            notExposeAsWebApp: "true"
        # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
        # Example tag: ${IMMICH_VERSION:-release}-cuda
        # or just $$cap_version if not using CUDA
        image: ghcr.io/immich-app/immich-machine-learning:$$cap_version
        # For GPU/CUDA support (uncomment if you need CUDA/gpu):
        # deploy:
        #   resources:
        #     reservations:
        #       devices:
        #         - driver: nvidia
        #           count: 1
        #           capabilities: [gpu]
        # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
        #   file: hwaccel.ml.yml
        #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
        environment:
            DB_PASSWORD: $$cap_app_db_pass
            DB_USERNAME: $$cap_app_db_user
            DB_DATABASE_NAME: $$cap_app_db_name
            DB_HOSTNAME: srv-captain--$$cap_appname-db
            REDIS_HOSTNAME: srv-captain--$$cap_appname-redis
            UPLOAD_LOCATION: $$cap_app_media_root
        volumes:
            - $$cap_appname-model-cache:/cache

    $$cap_appname-redis:
        caproverExtra:
            notExposeAsWebApp: "true"
        image: $$cap_redis_image

    $$cap_appname-db:
        caproverExtra:
            notExposeAsWebApp: "true"
        image: $$cap_postgres_image
        environment:
            POSTGRES_PASSWORD: $$cap_app_db_pass
            POSTGRES_USER: $$cap_app_db_user
            POSTGRES_DB: $$cap_app_db_name
            POSTGRES_INITDB_ARGS: "--data-checksums"
            # DB_STORAGE_TYPE: 'HDD' # Uncomment if not on SSD
            PG_DATA: /var/lib/postgresql/data
        volumes:
            - $$cap_appname-db-data:/var/lib/postgresql/data
        # shm_size: 128mb # CapRover does not support shm_size directly

    $$cap_appname-prometheus-init:
        caproverExtra:
            notExposeAsWebApp: "true"
        image: alpine:3
        command:
            - /bin/sh
            - -c
            - |
                mkdir -p /mnt/prometheus
                cat > /mnt/prometheus/prometheus.yml <<'EOF'
                global:
                scrape_interval:     15s
                evaluation_interval: 15s

                scrape_configs:
                - job_name: immich_api
                    static_configs:
                    - targets: ['srv-captain--$$cap_appname:8081']

                - job_name: immich_microservices
                    static_configs:
                    - targets: ['srv-captain--$$cap_appname:8082']
                EOF
                sleep 10
        volumes:
            - $$cap_appname-prometheus-config:/mnt/prometheus

    $$cap_appname-prometheus:
        caproverExtra:
            notExposeAsWebApp: "true"
            containerHttpPort: 9090
        image: $$cap_prometheus_image
        ports:
            - 9090:9090
        volumes:
            - $$cap_appname-prometheus-config:/etc/prometheus
            - $$cap_appname-prometheus-data:/prometheus
        depends_on:
            - $$cap_appname-prometheus-init

    $$cap_appname-grafana-init:
        image: alpine:3
        caproverExtra:
            notExposeAsWebApp: "true"
        command:
            - /bin/sh
            - -c
            - |
                mkdir -p /mnt/grafana/provisioning/datasources
                mkdir -p /mnt/grafana/provisioning/dashboards
                mkdir -p /mnt/grafana/dashboards

                # Write Prometheus datasource provisioning
                cat > /mnt/grafana/provisioning/datasources/datasource.yaml <<'EOF'
                apiVersion: 1
                datasources:
                  - name: Prometheus
                    type: prometheus
                    access: proxy
                    url: http://srv-captain--$$cap_appname-prometheus:9090
                    isDefault: true
                EOF

                # Write dashboards provisioning config
                cat > /mnt/grafana/provisioning/dashboards/immich-overview.yaml <<'EOF'
                apiVersion: 1
                providers:
                  - name: 'immich-overview'
                    orgId: 1
                    folder: ''
                    type: file
                    disableDeletion: false
                    updateIntervalSeconds: 10
                    options:
                      path: /var/lib/grafana/dashboards
                EOF

                # Download Immich Overview dashboard JSON
                wget -O /mnt/grafana/dashboards/immich-overview.json https://grafana.com/api/dashboards/22555/revisions/1/download

                sleep 10
        volumes:
            - $$cap_appname-grafana-config:/mnt/grafana

    $$cap_appname-grafana:
        image: $$cap_grafana_image
        restart: always
        caproverExtra:
            notExposeAsWebApp: "true"
            containerHttpPort: 3000
        depends_on:
            - $$cap_appname-grafana-init
        ports:
            - 3001:3000
        volumes:
            - $$cap_appname-grafana-config/provisioning:/etc/grafana/provisioning
            - $$cap_appname-grafana-config/dashboards:/var/lib/grafana/dashboards
            - $$cap_appname-grafana-data:/var/lib/grafana

volumes:
    $$cap_app_media_root:
    $$cap_appname-model-cache:
    $$cap_appname-db-data:
    $$cap_appname-prometheus-config:
    $$cap_appname-prometheus-data:
    $$cap_appname-grafana-config:
    $$cap_appname-grafana-data:

caproverOneClickApp:
    displayName: Immich 1.39.2+
    description: Open source (AGPLv3) Google Photos alternative with Prometheus and Grafana. Backup your photos and videos to your own server.
    isOfficial: false
    documentation: https://immich.app
    instructions:
        start: |-
            Leave every default value as is for a working and simple installation.
            You can specify the (full) path to the directory you want to save your media at. The directory must exist beforehand. Immich can be used from a browser but typically requires you to install the Immich app on your phone.
            If you have big media files (bigger than 500MB) that you want to backup, update your Nginx configuration file in CapRover to increase your `client_max_body_size` value, otherwise uploads will fail.

            Prometheus & Grafana:
            - Prometheus and Grafana are included for observability and metrics.
            - Visit Prometheus (port 9090) or Grafana (port 3001) from your CapRover dashboard.
            - Grafana connects to Prometheus at: `http://srv-captain--$$cap_appname-prometheus:9090`.
            - To see raw service metrics, you can expose metrics ports by uncommenting the relevant `ports:` and environment variables for Immich services:
            - More about env variables at https://immich.app/docs/install/environment-variables/#general
            - Then visit `/metrics` on those ports.

            Prometheus configuration:
            - Prometheus config file (`prometheus.yml`) is injected on first deploy and persisted. To update it, edit the Prometheus config variable and redeploy. After the first deploy, you can safely remove the `prometheus-init` service.

            GPU Support:
            - If your server has a compatible Nvidia GPU, enable machine learning acceleration by using the `-cuda` image tag and uncommenting the relevant deploy block.
            - Your host must have Nvidia drivers and the Docker GPU runtime enabled.

            Volumes & Data:
            - Upload directory, database, Prometheus, and Grafana all use named volumes.
            - If you change a volume path or a related environment variable (like `PG_DATA`), make sure they match exactly. Changing one without the other may cause data loss or misconfiguration.

        end: |-
            On your first visit it will ask for email and password to set up the admin user.
            Remember to change the default Nginx configuration and increase the `client_max_body_size` value if you expect to backup files bigger than 500MB, otherwise uploads will fail.

            Some upgrades take more and to preempt a restart go to **App Configs** and for now **Service Update Override** was preconfigured: `{ "TaskTemplate": { "RestartPolicy": { "Condition": "none", "MaxAttempts": "0" } } }`

            Prometheus and Grafana dashboards are available after deploy (ports 9090 and 3001).
            Grafana persists dashboards and Prometheus collects metrics from Immich and related services as configured.

    variables:
        - label: Immich version
          id: $$cap_version
          description: Check out their valid tags at https://github.com/immich-app/immich/releases
          defaultValue: v1.139.2
        - label: Immich Redis (Valkey) image
          id: $$cap_redis_image
          description: Full image ref (with tag or digest) for Redis/Valkey. Default matches latest compose.
          defaultValue: docker.io/valkey/valkey:8-bookworm@sha256:a137a2b60aca1a75130022d6bb96af423fefae4eb55faf395732db3544803280
        - label: Immich Postgres image
          id: $$cap_postgres_image
          description: Full image ref (with tag or digest) for the Immich-optimized Postgres. See https://github.com/immich-app/immich/releases for valid versions.
          defaultValue: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:32324a2f41df5de9efe1af166b7008c3f55646f8d0e00d9550c16c9822366b4a
        - label: Grafana image
          id: $$cap_grafana_image
          description: Find versions on DockerHub https://hub.docker.com/r/grafana/grafana/tags
          defaultValue: grafana/grafana:12.1
        - label: Prometheus image
          id: $$cap_prometheus_image
          description: Find versions on DockerHub https://hub.docker.com/r/prom/prometheus/tags
          defaultValue: prom/prometheus:v3.5.0
        - label: Database password
          id: $$cap_app_db_pass
          description: Password for accessing the database. A random one has been generated for you.
          defaultValue: $$cap_gen_random_hex(32)
        - label: Database username
          id: $$cap_app_db_user
          description: Username to access the database
          defaultValue: "immich"
        - label: Database name
          id: $$cap_app_db_name
          description: A name for the database used by Immich
          defaultValue: "immich"
        - label: Media root (legacy "upload" directory)
          id: $$cap_app_media_root
          description: Absolute host path where all Immich media will be stored (photos, videos, thumbnails, etc). Create this directory beforehand, or leave as default for a Docker-managed volume. If value is absolute (starts with /), it's a host directory; if relative, it's a persistent Docker volume managed by CapRover/Swarm.
          defaultValue: "immich-data"
